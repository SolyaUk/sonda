# =============================================================================
# Solana Ecosystem Endpoints Configuration
# =============================================================================
# This file defines all known infrastructure endpoints in the Solana ecosystem.
# Endpoints are organized by provider → cluster → service type → location.
#
# Values can be:
#   - Domain names (resolved via DNS at runtime)
#   - Direct IP:port strings (IP extracted, port stored as metadata)
#   - Dict with {ip: ..., bam_id: ...} for BAM API mapping
#
# BAM endpoints use bam_id to match against explorer.bam.dev/api/v1/nodes
# for reachability verification via API instead of TCP/HTTP checks.
#
# To add a new endpoint: simply add a new line under the appropriate section.
# To add a new provider: create a new top-level block following the same pattern.
#
# Last verified: 2026-02-25
# =============================================================================

jito:
  mainnet:
    block-engine:
      amsterdam: amsterdam.mainnet.block-engine.jito.wtf
      dublin: dublin.mainnet.block-engine.jito.wtf
      frankfurt: frankfurt.mainnet.block-engine.jito.wtf
      london: london.mainnet.block-engine.jito.wtf
      new-york: ny.mainnet.block-engine.jito.wtf
      salt-lake-city: slc.mainnet.block-engine.jito.wtf
      singapore: singapore.mainnet.block-engine.jito.wtf
      tokyo: tokyo.mainnet.block-engine.jito.wtf

    shred-receiver:
      amsterdam: "74.118.140.240:1002"
      dublin: "64.130.61.8:1002"
      frankfurt: "64.130.50.14:1002"
      london: "64.130.46.153:1002"
      new-york: "141.98.216.96:1002"
      salt-lake-city: "64.130.53.8:1002"
      singapore: "202.8.11.224:1002"
      tokyo: "202.8.9.160:1002"

    ntp:
      # NTP server domains — verify mappings if Jito updates docs
      amsterdam: ntp.amsterdam.jito.wtf
      dublin: ntp.dublin.jito.wtf
      frankfurt: ntp.frankfurt.jito.wtf
      london: ntp.london.jito.wtf
      dallas: ntp.dallas.jito.wtf
      salt-lake-city: ntp.slc.jito.wtf
      singapore: ntp.singapore.jito.wtf
      tokyo: ntp.tokyo.jito.wtf

  testnet:
    block-engine:
      dallas: dallas.testnet.block-engine.jito.wtf
      new-york: ny.testnet.block-engine.jito.wtf

    shred-receiver:
      dallas: "141.98.218.12:1002"
      new-york: "64.130.35.224:1002"

    # BAM testnet nodes (bam.dev/validators): no explorer API, so each is
    # checked by TCP on 50055, the port FireBAM/jito-solana connect to.
    bam:
      dallas: {ip: dfw.testnet.bam.jito.wtf, check: "tcp:50055"}
      frankfurt: {ip: fra.testnet.bam.jito.wtf, check: "tcp:50055"}
      new-york: {ip: ewr.testnet.bam.jito.wtf, check: "tcp:50055"}
      salt-lake-city: {ip: slc.testnet.bam.jito.wtf, check: "tcp:50055"}
      seattle: {ip: sea.testnet.bam.jito.wtf, check: "tcp:50055"}

  alpenglow-community:
    # single BAM node for the community cluster (Discord, 2026-09-04),
    # validators use --bam-url http://198.13.140.247; checked on 50055
    bam:
      frankfurt: {ip: "198.13.140.247", check: "tcp:50055"}

harmonic:
  # Source: docs.harmonic.gg/run-a-validator/endpoints (checked 2026-09-24).
  # auction.* = legacy DNS of what Harmonic now calls the Block Engine; the
  # be.* names below (service "bundles") point at the same servers. Both kept:
  # endpoint history is keyed by these service names.
  mainnet:
    auction:
      amsterdam: ams.auction.harmonic.gg
      newark: ewr.auction.harmonic.gg
      frankfurt: fra.auction.harmonic.gg
      london: lon.auction.harmonic.gg
      tokyo: tyo.auction.harmonic.gg
      singapore: sgp.auction.harmonic.gg
      salt-lake-city: slc.auction.harmonic.gg

    tpu-relayer:
      amsterdam: ams.tpu.harmonic.gg
      newark: ewr.tpu.harmonic.gg
      frankfurt: fra.tpu.harmonic.gg
      london: lon.tpu.harmonic.gg
      tokyo: tyo.tpu.harmonic.gg
      singapore: sgp.tpu.harmonic.gg
      salt-lake-city: slc.tpu.harmonic.gg

    # shred receivers now sit on the TPU hosts (UDP 8001, unverifiable)
    shred-receiver:
      amsterdam: "63.254.166.232:8001"
      newark: "64.130.45.196:8001"
      frankfurt: "198.13.140.105:8001"
      london: "64.130.46.242:8001"
      tokyo: "198.13.133.200:8001"
      singapore: "198.13.130.10:8001"
      salt-lake-city: "64.130.33.192:8001"

    bundles:
      frankfurt: fra.be.harmonic.gg
      london: lon.be.harmonic.gg
      amsterdam: ams.be.harmonic.gg
      newark: ewr.be.harmonic.gg
      tokyo: tyo.be.harmonic.gg
      singapore: sgp.be.harmonic.gg

  testnet:
    # one region on testnet (Salt Lake City); block engine and TPU over HTTPS,
    # shred receiver UDP (unverifiable)
    auction:
      salt-lake-city: testnet.be.harmonic.gg
    tpu-relayer:
      salt-lake-city: testnet.tpu.harmonic.gg
    shred-receiver:
      salt-lake-city: "64.130.53.76:8001"

