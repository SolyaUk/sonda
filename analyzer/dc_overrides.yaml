# =============================================================================
# Datacenter and ASN Overrides
# =============================================================================
#
# Two-level lookup in derive_views.py:
#   1. "{asn}_{city}" — overrides for specific DC location (most specific wins)
#   2. "{asn}"        — overrides for entire ASN
#   3. Fallback to raw asn_name from geolocation
#
# Fields (all optional, can be empty or omitted):
#   display_name   — human-readable label
#   website        — provider's homepage
#   incidents      — provider's incidents site or api
#   icon_url       — logo URL for light theme (if only one icon_* field, used for both themes)
#   icon_url_dark  — logo URL for dark theme (frontend picks based on active theme)
#   country        — ISO country code (only to override geo data)
#   city           — explicit city (rarely needed)
#   notes          — internal notes, NOT shown on UI
#   tags           — list of confirmed traits (see conventions below)
#   affiliate:     — for future monetization, currently inert
#     code:        — referral code
#     url:         — full referral URL
#     notes:       — internal notes about partnership
#
# Tag conventions (use sparingly, only with confirmed evidence):
#   solana-focused   — provider has explicit Solana packages or community partnerships
#                      Confirmed: Edgevana, Cherry Servers, Mevspace
#   bare-metal       — physical hardware (the norm for Solana validators)
#   cloud-only       — VPS/cloud only; warning, atypical for Solana
#   banned           — provider doesn't allow Solana validators
#                      Confirmed: Hetzner (since 2022)
#   resold           — reselling another provider's infrastructure
#   deprecated       — no longer recommended
#   validator-funding — provider invests in Solana ecosystem
#   DZ-partner       — integrated with DoubleZero
#
# Initial fill is best-effort based on public information. Marked with "# ?"
# where uncertain — please verify and edit.
# =============================================================================


# ============================================================================
# ASN-LEVEL OVERRIDES (apply across all cities of this ASN)
# Sorted roughly by total stake across all clusters (most impactful first)
