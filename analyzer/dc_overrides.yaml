# =============================================================================
# Datacenter and ASN Overrides
# =============================================================================
#
# Two-level lookup in derive_views.py:
#   1. "{asn}_{city}" — overrides for specific DC location (most specific wins)
#   2. "{asn}"        — overrides for entire ASN
#   3. Fallback to raw asn_name from geolocation
#
# Fields (all optional, can be empty or omitted):
#   display_name   — human-readable label
#   website        — provider's homepage
#   incidents      — provider's incidents site or api
#   icon_url       — logo URL for light theme (if only one icon_* field, used for both themes)
#   icon_url_dark  — logo URL for dark theme (frontend picks based on active theme)
#   country        — ISO country code (only to override geo data)
#   city           — explicit city (rarely needed)
#   notes          — internal notes, NOT shown on UI
#   tags           — list of confirmed traits (see conventions below)
#   affiliate:     — for future monetization, currently inert
#     code:        — referral code
#     url:         — full referral URL
#     notes:       — internal notes about partnership
#
# Tag conventions (six tags, each with a way to verify it; no tag = a hosting
# provider you can rent servers from, which is the norm and needs no mark):
#   solana-focused   — provider has explicit Solana packages or community partnerships
#                      (verify on the provider's site)
#   DZ-partner       — integrated with DoubleZero (verify on DoubleZero's partner list)
#   banned           — provider does not allow Solana validators (verify in their ToS)
#                      Confirmed: Hetzner (since 2022)
#   isp              — residential or business internet access, i.e. the validator
#                      runs at someone's home or office, not in a datacenter
#                      (PeeringDB info_type "Cable/DSL/ISP", or an obvious ISP brand)
#   transit          — carrier/backbone that owns the IP range but rents no servers;
#                      the validator sits in an unknown datacenter behind it
#                      (PeeringDB info_type "NSP": Cogent, Arelion, RETN, Hurricane Electric)
#   private          — the ASN belongs to the validator operator, exchange or fund itself
#                      (registry organisation = the validator's own name)
#
# Retired 2026-09-11: bare-metal (all Solana validators are), cloud-only (false for
# the hyperscalers' bare-metal offers), resold (modelled by ASN_city entries),
# deprecated, validator-funding, network-provider (split into isp and transit).
#
# Initial fill is best-effort based on public information. Marked with "# ?"
# where uncertain — please verify and edit.
# =============================================================================


# ============================================================================
